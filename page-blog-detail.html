<!DOCTYPE html>
<html lang="ja">

<head>

<body>
  <div id="container">

            <p class="p-header__company">

        </div>

        <!-- SP用 -->
        <div class="p-header__sp sp">
          <button id="js-hamburger" class="p-header__hamburger c-hamburger">

          <!-- SPドロワーメニュー -->
          <div class="p-header__menu">

          <ul>

            <li class="p-header__nav-item"><a href="#blog">ブログ</a></li>

    <main class="main">

      <div class="p-fv">
        <div class="p-fv__image">
          <picture>
            <source media="(min-width: 768px)" srcset="./image/plan-mv-pc.jpg">
            <img src="./image/plan-mv-sp.jpg" alt="きたむらミュージックスクールプランページのファーストビュー">

        </div>

        <div class="p-fv__contents">

          </div>
        </div>
      </div>

      <!-- パンくずリスト -->
      <div class="">
        <div class="c-bread">
          <ol>
            <li><a href="#">ホーム</a></li>

            <li><a href="#">3つ目</a></li>
            <li><a href="#">4つ目4つ目4つ目4つ目4つ目</a></li>
          </ol>

      <!--  -->
      <section id="" class="price">

          <div class="c-section-title">

              H3見出しが入ります。H3見出しが入ります。

          <div class="c-to-top-arrow">

      <div class="c-button">
        <a href="#">お問い合わせ</a>

    <footer class="footer">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
